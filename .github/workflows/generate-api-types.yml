name: Generate API Types

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'scripts/export_openapi.py'
      - '.github/workflows/generate-api-types.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --no-dev

      - name: Export OpenAPI schema
        run: uv run --locked --no-dev python scripts/export_openapi.py

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate API types from OpenAPI
        run: node --run generate:api

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: 'ci: update openapi client'
          file_pattern: 'openapi.json app/lib/api/generated/**'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
