name: Generate API Types

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'scripts/export_openapi.py'
      - '.github/workflows/generate-api-types.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --no-dev

      - name: Export OpenAPI schema
        run: uv run --locked --no-dev python scripts/export_openapi.py

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate API types from OpenAPI
        run: node --run generate:api

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@3ea6ae190baf489ba007f7c92608f33ce20ef04a # v4
        with:
          commit_message: 'ci: update openapi client'
          file_pattern: 'openapi.json app/lib/api/generated/**'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
